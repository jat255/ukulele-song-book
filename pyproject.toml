[project]
name = "ukulele-songbook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "playwright>=1.65.0",
    "pypdf>=7.0.1",
    "pypdfium2>=5.15.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
