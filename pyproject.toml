[project]
name = "ukulele-songbook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "playwright>=1.65.0",
    "pypdf>=7.0.1",
    "pypdfium2>=5.15.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
songbook = "server.songbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
